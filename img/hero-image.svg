    &lt;/&gt;
  </text>

  <circle cx="150" cy="240" r="22" fill="#4DB5FF" opacity="0.7" />
  <text x="150" y="245" font-family="Arial" font-size="18" fill="#FFFFFF" text-anchor="middle">css</text>

  <!-- Alt kısım - karakter gölgesi -->
  <ellipse cx="250" cy="410" rx="100" ry="20" fill="#1C2333" opacity="0.3" />
  
  <!-- Karakter ayakları -->
  <rect x="200" y="300" width="30" height="110" rx="10" fill="#6C63FF" />
  <rect x="270" y="300" width="30" height="110" rx="10" fill="#6C63FF" />
  
  <!-- Dekoratif çemberler -->
  <circle cx="100" cy="100" r="15" fill="#6C63FF" opacity="0.4" />
  <circle cx="120" cy="80" r="10" fill="#4DB5FF" opacity="0.4" />
  <circle cx="400" cy="350" r="20" fill="#6C63FF" opacity="0.4" />
  <circle cx="370" cy="320" r="12" fill="#4DB5FF" opacity="0.4" />
  <circle cx="420" cy="120" r="25" fill="#6C63FF" opacity="0.2" />
</svg> 